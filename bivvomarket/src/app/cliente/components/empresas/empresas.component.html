<app-titulo-seccion
  [Titulo1]="'NuestroClientes' | transloco"
  [desc1]="'NuestroClientes.Sub' | transloco"
>
</app-titulo-seccion>
<div class="container my-4">
  <div class="row g-3 row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5">
    <div class="col" *ngFor="let f of fotos; trackBy: trackBySrc">
      <figure
        class="card overflow-hidden h-100 shadow-sm text-center p-3 aliado-card"
      >
        <div
          class="card-body d-flex flex-column align-items-center justify-content-start p-0"
        >
          <div class="img-box mx-auto mb-2">
            <img [src]="f.src" [alt]="f.alt" loading="lazy" decoding="async" />
          </div>
          <figcaption *ngIf="f.caption" class="aliado-caption">
            {{ f.caption }}
          </figcaption>
        </div>
      </figure>
    </div>
  </div>
</div>
