            [attr.aria-expanded]="

        <div

            header_big

              : 'col-xl-9 col-lg-9 col-md-8 col-sm-8'
          "
        >
          <div
            class="header__right p-relative"
            [ngClass]="{
              'd-flex justify-content-between align-items-center': !header_big
            }"
          >
            <div
              [ngClass]="{
                'main-menu': true,
                'main-menu-2': header_big,
                'text-center': header_big,
                'd-none d-lg-block': true
              }"
            >
              <!-- nav menu start -->
              <app-nav-manus></app-nav-manus>
              <!-- nav menu end -->
            </div>
            <div class="header__action">
              <ul>
                <li>
                  <button
                    (click)="changeLang('es')"
                    class="btn-lang"
                    style="padding-right: 3px"
                  >
                    <img
                      src="assets/flags/peru-48.png"
                      alt="Español"
                      width="20"
                    />
                    ES
                  </button>
                  <button (click)="changeLang('en')" class="btn-lang">
                    <img
                      src="assets/flags/estados-unidos-48.png"
                      alt="English"
                      width="20"
                    />
                    EN
                  </button>
                </li>
                <li *ngFor="let item of social_links">
                  <a
                    class="cart cursor-pointer"
                    href="{{ item.link }}"
                    target="_blank"
                  >
                    <!-- <i class="{{ item.icon }}"></i> -->
                    <img
                      [src]="item.svgUrl"
                      width="24"
                      height="24"
                      [alt]="item.name"
                      class="icon-svg"
                    />
                  </a>
                </li>
                <li>
                  <a class="cart cursor-pointer">
                    <i class="fas fa-cart-plus"></i>
                    <span class="cart-number-2">{{
                      cartService.totalPriceQuantity().quantity
                    }}</span>
                  </a>
                  <!-- mini cart start -->
                  <app-mini-cart></app-mini-cart>
                  <!-- mini cart end -->
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
