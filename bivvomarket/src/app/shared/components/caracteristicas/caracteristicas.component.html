<!-- Lado derecho: iconos -->
<div
  class="lado derecho"
  [ngStyle]="{
    backgroundColor: colorFondo
  }"
>
  <div class="grid-iconos">
    <!-- Ícono 1: Natural -->
    <div class="icono-card">
      <div class="icono-svg">
        <svg
          width="60"
          height="60"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#eb3a11"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 12c-1-2-2-3-4-4 0 2 1 3 1 5" />
          <path d="M12 12c1-2 3-3 4-4 0 2-1 3-1 5" />
        </svg>
      </div>
      <h4>{{ "video.Natural" | transloco }}</h4>
      <p>{{ "video.Sugar" | transloco }}</p>
    </div>

    <!-- Ícono 2: Hermético -->
    <!-- <div class="icono-box"> -->
    <div class="icono-card">
      <div class="icono-svg">
        <svg
          width="60"
          height="60"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#eb3a11"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M8 16c0-2 2-4 4-6 2 2 4 4 4 6" />
        </svg>
      </div>
      <h4>{{ "video.Hermetic" | transloco }}</h4>
      <p>{{ "video.Keeps" | transloco }}</p>
    </div>

    <!-- Ícono 3: Alto en Proteínas -->
    <div class="icono-card">
      <div class="icono-svg">
        <svg
          width="60"
          height="60"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#eb3a11"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4" />
          <line x1="12" y1="2" x2="12" y2="4" />
          <line x1="12" y1="20" x2="12" y2="22" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="2" y1="12" x2="4" y2="12" />
          <line x1="20" y1="12" x2="22" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      </div>
      <h4>{{ "video.High" | transloco }}</h4>
      <p>{{ "video.Source" | transloco }}</p>
    </div>

    <!-- Ícono 4: Premium -->
    <div class="icono-card">
      <div class="icono-svg">
        <svg
          width="60"
          height="60"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#eb3a11"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="8" r="6" />
          <path d="M8 15l-2 5 6-3 6 3-2-5" />
        </svg>
      </div>
      <h4>{{ "video.Premium" | transloco }}</h4>
      <p>{{ "video.Product" | transloco }}</p>
    </div>
  </div>
</div>
