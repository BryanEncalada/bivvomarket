<div class="container py-4">
  <div class="row g-3 justify-content-center">
    <div class="col-10 col-sm-6 col-md-4" *ngFor="let img of images">
      <div class="img-hover-wrapper">
        <img
          [src]="img.src"
          [alt]="img.alt"
          class="img-fluid rounded-4 shadow-sm hover-zoom"
          loading="lazy"
          decoding="async"
        />
      </div>
    </div>
  </div>
</div>
