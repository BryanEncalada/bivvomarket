<div class="row">
  <div
    [ngClass]="
      style_2
        ? 'col-xl-5 col-lg-5 col-md-6 col-sm-12 col-12'
        : 'col-xl-6 col-lg-6'
    "
  >
    <div *ngIf="!style_2" class="product__modal-box d-flex">
      <div class="product__modal-nav mr-20">
        <nav>
          <div class="nav nav-tabs" id="product-details" role="tablist">
            <a
              *ngFor="let img of product.imagenes"
              class="nav-item nav-link mb-1 cursor-pointer"
            >
              <!-- [class.active]="img === productService.activeImg" -->
              <div
                class="product__nav-img w-img"
                (click)="productService.handleImageActiveArray(img.imagen)"
              >
                <img
                  [src]="img.imagen"
                  alt="product-img"
                  style="width: 92px; height: 117px"
                />
              </div>
            </a>
          </div>
        </nav>
      </div>
      <div class="mb-20">
        <div class="product__modal-img product__thumbF w-img">
          <img [src]="productService.activeImg" alt="product-img" />
          <div *ngIf="product.discount || product.new" class="product__sale">
            <span *ngIf="product.new || product.discount" class="new">new</span>
            <span *ngIf="product.discount" class="percent"
              >-{{ product.discount }}%</span
            >
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="style_2" class="product__modal-box">
      <div class="mb-20">
        <div class="product__modal-img w-img">
          <img [src]="productService.activeImg" alt="product-img" />
        </div>
      </div>
      <nav>
        <div class="nav nav-tabs" id="product-details" role="tablist">
          <a
            *ngFor="let img of product.imagenes"
            class="nav-item nav-link cursor-pointer me-2"
          >
            <!-- [class.active]="img === productService.activeImg" -->
            <div
              class="product__nav-img w-img"
              (click)="productService.handleImageActive(img.imagen)"
            >
              <img
                [src]="img.imagen"
                alt="product-img"
                style="width: 92px; height: 117px"
              />
            </div>
          </a>
        </div>
      </nav>
    </div>
  </div>

  <div
    [ngClass]="
      style_2
        ? 'col-xl-7 col-lg-7 col-md-6 col-sm-12 col-12'
        : 'col-xl-6 col-lg-6'
    "
  >
    <div class="product__modal-content product__modal-content-2">
      <h4>
        <a [routerLink]="['/shop/shop-details', product._id]">{{
          product.title
        }}</a>
      </h4>
      <div class="rating rating-shop mb-15">
        <ul>
          <li>
            <span><i class="fas fa-star"></i></span>
          </li>
          <li>
            <span><i class="fas fa-star"></i></span>
          </li>
          <li>
            <span><i class="fas fa-star"></i></span>
          </li>
          <li>
            <span><i class="fas fa-star"></i></span>
          </li>
          <li>
            <span><i class="fal fa-star"></i></span>
          </li>
        </ul>
        <span class="rating-no ml-10 rating-left"> </span>
        <!-- <span class="review rating-left"><a href="#">Add your Review</a></span> -->
      </div>
      <div class="product__price-2 mb-25">
        <span>S/{{ product.price }}</span>
        <span *ngIf="product.old_price > 0" class="old-price"
          >${{ product.old_price }}</span
        >
      </div>
      <div class="product__modal-des mb-30">
        <p>{{ product.sm_desc }}</p>
      </div>
      <div class="product__modal-form mb-30">
        <form action="#">
          <div class="pro-quan-area d-sm-flex align-items-center">
            <div class="product-quantity-title">
              <label>{{ "Cantidad" | transloco }}</label>
            </div>
            <div class="product-quantity mr-20 mb-20">
              <div class="cart-plus-minus">
                <input
                  type="text"
                  [value]="cartService.orderQuantity"
                  disabled
                  readonly
                />

                <div (click)="cartService.decrement()" class="dec qtybutton">
                  -
                </div>
                <div (click)="cartService.increment()" class="inc qtybutton">
                  +
                </div>
              </div>
            </div>
            <div class="pro-cart-btn">
              <a
                (click)="cartService.addCartProduct(product)"
                class="add-cart-btn mb-20 cursor-pointer"
              >
                + {{ "AgregarCarrito" | transloco }}
              </a>
            </div>
          </div>
        </form>
      </div>

      <div *ngIf="bottomShow">
        <div class="product__tag mb-25">
          <span>Categoria:</span>
          <span
            ><a class="cursor-pointer">{{ product.category }}</a></span
          >
        </div>
        <div class="product__share">
          <span>{{ "Compartir" | transloco }} :</span>

          <ul>
            <li *ngFor="let item of social_links">
              <a
                class="cart cursor-pointer"
                href="{{ item.link }}"
                target="_blank"
              >

                <img
                  [src]="item.svgUrl"
                  width="24"
                  height="24"
                  [alt]="item.name"
                  class="icon-svg"
                />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
